<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inloggen verwerken…</title>
<meta name="theme-color" content="#151715">
<link rel="icon" href="/logo.png">
<style>
:root{--bg:#151715;--text:#f2f4f1;--blue:#5aaeff;--ok:#4ade80;--err:#ff8a8a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 30%,#1f2a22,var(--bg) 60%);color:var(--text);font:600 15px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center;padding:20px}
.box{max-width:480px;animation:in .6s cubic-bezier(.2,.7,.2,1) both}
h1{font-size:28px;margin:0 0 12px;font-weight:800;letter-spacing:-.04em}
p{margin:0 0 6px;color:#a1a7a0}
.spin{width:44px;height:44px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 24px}
.ok,.bad{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:800;margin:0 auto 20px;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.ok{background:rgba(74,222,128,.15);color:var(--ok)}
.bad{background:rgba(255,138,138,.15);color:var(--err)}
.err{color:var(--err);margin-top:10px;font-size:13px}
.btn{display:inline-block;margin-top:16px;background:var(--blue);color:#06213a;border-radius:99px;padding:12px 24px;font-weight:700;text-decoration:none}
a{color:var(--blue);font-weight:700}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="box">
  <div id="ic" class="spin"></div>
  <h1 id="title">Even geduld…</h1>
  <p id="msg">Je CFX-account wordt gekoppeld.</p>
  <p id="err" class="err"></p>
  <div id="act"></div>
</div>

<script>
(async () => {
  const $ = id => document.getElementById(id);
  const readJson = async r => { const t = await r.text(); try { return JSON.parse(t); } catch { return { error: 'Serverfout (' + r.status + ')' }; } };
  const params = new URLSearchParams(location.search);

  // Basket-ident: eerst uit de URL (door onze API meegegeven), anders de opgeslagen pending-basket
  let pending = null;
  try { pending = sessionStorage.getItem('pendingBasket'); } catch {}
  const basketIdent = params.get('basket') || params.get('basketIdent') || params.get('basket_ident') || pending;
  const itemsRaw = params.get('items');

  const state = (kind, title, msg) => {
    const ic = $('ic');
    ic.className = kind === 'ok' ? 'ok' : kind === 'bad' ? 'bad' : 'spin';
    ic.textContent = kind === 'ok' ? '✓' : kind === 'bad' ? '!' : '';
    $('title').textContent = title;
    $('msg').textContent = msg;
  };
  const fail = (msg) => {
    state('bad', 'Er ging iets mis', 'Probeer het nog een keer via de website.');
    $('err').textContent = msg;
    $('act').innerHTML = '<a class="btn" href="/#/">Terug naar de website</a>';
  };

  if (!basketIdent) return fail('Geen sessie gevonden. Klik op de website opnieuw op "Inloggen".');

  // 1. CFX-naam ophalen
  let username;
  try {
    const r = await fetch('/api/session?basket=' + encodeURIComponent(basketIdent));
    const d = await readJson(r);
    if (!r.ok) throw new Error(d.error || 'Sessie ophalen mislukt');
    username = d.username;
  } catch (e) { return fail(e.message); }

  if (!username) return fail('Inloggen is niet voltooid. Probeer het opnieuw.');

  // 2. Opslaan zodat de website de naam kan tonen
  try {
    localStorage.setItem('cfx', JSON.stringify({ username, ident: basketIdent }));
    sessionStorage.setItem('welcome', username);
    sessionStorage.removeItem('pendingBasket');
  } catch {}

  // 3a. Alleen inloggen: terug naar de site
  let items = null;
  if (itemsRaw) { try { items = JSON.parse(itemsRaw); } catch {} }
  if (!Array.isArray(items) || !items.length) {
    state('ok', 'Welkom, ' + username + '!', 'Je bent ingelogd. Je wordt teruggestuurd…');
    setTimeout(() => { location.replace('/#/'); }, 1200);
    return;
  }

  // 3b. Afrekenen: packages toevoegen en door naar de kassa
  state('spin', 'Welkom, ' + username + '!', 'Je winkelmand wordt klaargezet…');
  try {
    const r = await fetch('/api/add-packages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ basketIdent, items })
    });
    const d = await readJson(r);
    if (!r.ok || !d.url) throw new Error(d.error || 'Onbekende fout');
    state('ok', 'Gelukt!', 'Je wordt doorgestuurd naar de kassa…');
    setTimeout(() => { location.href = d.url; }, 800);
  } catch (e) {
    fail(e.message);
    $('act').innerHTML = '<a class="btn" href="/#/winkelmand">Terug naar winkelmand</a>';
  }
})();
</script>
</body>
</html>
